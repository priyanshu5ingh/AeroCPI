services:
  - type: pgo
    name: aerocpi-postgres
    plan: free
    version: "15"

  - type: web
    name: aerocpi-api
    runtime: python
    repo: https://github.com/priyanshu5ingh/AeroCPI
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aerocpi-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://aerocpi-frontend.onrender.com"
      - key: DUFFEL_API_TOKEN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false

  - type: web
    name: aerocpi-frontend
    runtime: static
    repo: https://github.com/priyanshu5ingh/AeroCPI
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://aerocpi.onrender.com/api/v1"

  - type: cron
    name: aerocpi-collection-cron
    runtime: python
    repo: https://github.com/priyanshu5ingh/AeroCPI
    plan: free
    schedule: "0 2 * * *"
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python scripts/run_daily_collection.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aerocpi-postgres
          property: connectionString
      - key: DUFFEL_API_TOKEN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
